[package]
name = "stone-kvs"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[features]
test-utils = []

[dependencies]
log = "0.4.28"
env_logger= "0.11.8"

[dev-dependencies]
criterion = "0.8.0"
tempfile = "3.23.0"
rand = "0.8.5"

[[bench]]
name = "crc32c_bench"
harness = false

[[bench]]
name = "inner_wal_bench"
harness = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
rocksdb = { version = "0.23", default-features = false }

[[test]]
name = "rocksdb_multithreaded_benchmark_writes"
path = "benchmarks/multithreaded_benchmark_writes_rocksdb.rs"

[[test]]
name = "stonekvs_multithreaded_benchmark_writes"
path = "benchmarks/multithreaded_benchmark_writes_stonekvs.rs"
